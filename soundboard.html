<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DJ Jakob — Soundboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --cyan:   #00D4FF;
            --pink:   #FF0066;
            --orange: #FF8C00;
            --purple: #9B59FF;
            --green:  #1ED760;
            --blue:   #0099FF;
            --dark:   #0A0A1A;
            --mid:    #12122A;
            --card:   #16162E;
            --white:  #FDFAF5;
            --muted:  rgba(253,250,245,0.55);
            --border: rgba(0,212,255,0.12);
        }
        html, body { height: 100%; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--dark);
            color: var(--white);
            overflow-x: hidden;
        }

        /* ===== PIN SCREEN ===== */
        #pin-screen {
            position: fixed; inset: 0; z-index: 200;
            background: var(--dark);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 20px;
        }
        .pin-logo { width: 90px; height: 90px; border-radius: 50%;
            filter: drop-shadow(0 0 14px rgba(255,140,0,0.6)); }
        .pin-title { font-family: 'Bebas Neue', sans-serif;
            font-size: 32px; letter-spacing: 0.06em; color: var(--white); }
        .pin-sub { font-size: 13px; color: var(--muted); }
        .pin-dots { display: flex; gap: 12px; }
        .pin-dot { width: 14px; height: 14px; border-radius: 50%;
            border: 2px solid rgba(0,212,255,0.35);
            transition: background 200ms ease, border-color 200ms ease; }
        .pin-dot.filled { background: var(--cyan); border-color: var(--cyan); }
        .numpad { display: grid; grid-template-columns: repeat(3, 72px); gap: 10px; }
        .numpad button {
            height: 72px; border: 1px solid var(--border);
            background: var(--card); color: var(--white);
            font-family: 'Inter', sans-serif; font-size: 22px; font-weight: 600;
            border-radius: 6px; cursor: pointer;
            transition: background 150ms ease, border-color 150ms ease;
        }
        .numpad button:active { background: rgba(0,212,255,0.18); border-color: var(--cyan); }
        .numpad .btn-backspace { font-size: 16px; color: var(--muted); }

        /* ===== APP ===== */
        #app { display: none; flex-direction: column; min-height: 100vh; }

        /* ===== HEADER ===== */
        .sb-header {
            background: rgba(10,10,26,0.95);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(14px);
            padding: 14px 24px;
            display: flex; align-items: center; gap: 16px;
            position: sticky; top: 0; z-index: 50;
        }
        .sb-logo { height: 42px; width: 42px; border-radius: 50%;
            filter: drop-shadow(0 0 8px rgba(255,140,0,0.5)); }
        .sb-title { font-family: 'Bebas Neue', sans-serif;
            font-size: 26px; letter-spacing: 0.06em; color: var(--cyan); flex: 1; }
        .btn-stop-all {
            background: var(--pink); color: var(--white);
            border: none; padding: 12px 24px;
            font-family: 'Inter', sans-serif; font-size: 13px;
            font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
            border-radius: 6px; cursor: pointer;
            box-shadow: 0 0 18px rgba(255,0,102,0.4);
            transition: background 150ms, box-shadow 150ms, transform 100ms;
            display: flex; align-items: center; gap: 8px;
        }
        .btn-stop-all:active { background: #cc0052; transform: scale(0.97); }
        .btn-logout {
            background: transparent; color: var(--muted);
            border: 1px solid var(--border); padding: 10px 16px;
            font-size: 12px; font-weight: 600; letter-spacing: 0.06em;
            text-transform: uppercase; border-radius: 6px; cursor: pointer;
            transition: color 150ms, border-color 150ms;
        }
        .btn-logout:hover { color: var(--white); border-color: rgba(0,212,255,0.3); }

        /* ===== GRID ===== */
        .sb-grid-wrap { flex: 1; padding: 20px 24px 32px; }
        .sb-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 14px;
            max-width: 1100px;
            margin: 0 auto;
        }

        /* ===== BUTTON ===== */
        .sb-btn {
            position: relative;
            min-height: 130px;
            border-radius: 10px;
            cursor: pointer;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 6px; padding: 14px 10px 10px;
            transition: transform 100ms ease, box-shadow 250ms ease;
            user-select: none; -webkit-user-select: none;
            touch-action: manipulation;
            border: 2px dashed rgba(255,255,255,0.12);
            background: var(--card);
            overflow: hidden;
        }
        /* Empty button */
        .sb-btn.empty .sb-plus {
            font-size: 28px; color: rgba(255,255,255,0.2);
            transition: color 200ms;
        }
        .sb-btn.empty .sb-empty-label {
            font-size: 10px; color: rgba(255,255,255,0.18);
            letter-spacing: 0.06em; text-transform: uppercase; text-align: center;
        }
        .sb-btn.empty:hover { border-color: rgba(0,212,255,0.35); }
        .sb-btn.empty:hover .sb-plus { color: rgba(0,212,255,0.6); }

        /* Filled button */
        .sb-btn.filled {
            border-style: solid;
            border-width: 2px;
        }
        .sb-btn.filled .sb-btn-label {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 17px; letter-spacing: 0.04em;
            text-align: center; line-height: 1.2;
            color: var(--white);
            max-width: 100%; overflow: hidden;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
        }
        .sb-btn.filled .sb-volume-bar {
            width: 80%; height: 3px; border-radius: 2px;
            background: rgba(255,255,255,0.15); overflow: hidden;
        }
        .sb-volume-fill { height: 100%; border-radius: 2px; }
        .sb-btn.filled .sb-meta {
            display: flex; gap: 6px; align-items: center;
        }
        .sb-loop-badge {
            font-size: 9px; font-weight: 700; letter-spacing: 0.08em;
            padding: 2px 6px; border-radius: 3px;
            background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.6);
            text-transform: uppercase;
        }
        .sb-slot-num {
            font-size: 9px; color: rgba(255,255,255,0.25);
            font-weight: 600;
        }

        /* Playing state */
        .sb-btn.playing {
            animation: btnPulse 1.4s ease-in-out infinite;
        }
        @keyframes btnPulse {
            0%, 100% { box-shadow: 0 0 14px rgba(var(--btn-rgb), 0.4); }
            50%       { box-shadow: 0 0 32px rgba(var(--btn-rgb), 0.75), 0 0 60px rgba(var(--btn-rgb), 0.3); }
        }
        .sb-btn:active { transform: scale(0.95); }

        /* Gear icon */
        .sb-gear {
            position: absolute; top: 7px; right: 8px;
            width: 22px; height: 22px;
            background: rgba(0,0,0,0.35); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 150ms;
            cursor: pointer; z-index: 2;
            border: none; padding: 0;
        }
        .sb-btn.filled:hover .sb-gear,
        .sb-btn.filled .sb-gear:focus { opacity: 1; }
        /* Always show on touch devices */
        @media (hover: none) { .sb-gear { opacity: 0.6 !important; } }
        .sb-gear svg { pointer-events: none; }

        /* Playing indicator */
        .sb-playing-dot {
            position: absolute; top: 7px; left: 9px;
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--white); opacity: 0;
            transition: opacity 200ms;
        }
        .sb-btn.playing .sb-playing-dot { opacity: 1; animation: dotBlink 1.4s ease-in-out infinite; }
        @keyframes dotBlink { 0%,100%{opacity:1} 50%{opacity:0.3} }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed; inset: 0; z-index: 100;
            background: rgba(0,0,0,0.72);
            display: none; align-items: center; justify-content: center;
            padding: 20px;
            backdrop-filter: blur(4px);
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: var(--mid);
            border: 1px solid rgba(0,212,255,0.18);
            border-radius: 12px;
            width: 100%; max-width: 440px;
            padding: 28px 28px 24px;
            display: flex; flex-direction: column; gap: 18px;
        }
        .modal-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 24px; letter-spacing: 0.04em; color: var(--white);
        }
        .modal-field { display: flex; flex-direction: column; gap: 8px; }
        .modal-label {
            font-size: 10px; font-weight: 700; letter-spacing: 0.14em;
            text-transform: uppercase; color: var(--cyan);
        }
        .modal-input {
            background: rgba(255,255,255,0.05);
            border: none; border-bottom: 2px solid rgba(0,212,255,0.22);
            padding: 12px 0; color: var(--white);
            font-family: 'Inter', sans-serif; font-size: 15px; outline: none;
            transition: border-color 200ms;
        }
        .modal-input:focus { border-bottom-color: var(--cyan); }
        .modal-input::placeholder { color: rgba(253,250,245,0.22); }

        .file-drop {
            border: 2px dashed rgba(0,212,255,0.25);
            border-radius: 8px; padding: 20px;
            text-align: center; cursor: pointer;
            transition: border-color 200ms, background 200ms;
        }
        .file-drop:hover, .file-drop.drag-over {
            border-color: var(--cyan); background: rgba(0,212,255,0.05);
        }
        .file-drop-icon { font-size: 28px; margin-bottom: 6px; }
        .file-drop-text { font-size: 13px; color: var(--muted); }
        .file-drop-name { font-size: 12px; color: var(--cyan); margin-top: 4px; font-weight: 600; }
        .file-input-hidden { display: none; }

        .volume-row { display: flex; align-items: center; gap: 12px; }
        .volume-slider {
            flex: 1; -webkit-appearance: none; appearance: none;
            height: 4px; border-radius: 2px;
            background: rgba(255,255,255,0.15); outline: none; cursor: pointer;
        }
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none; width: 18px; height: 18px;
            border-radius: 50%; background: var(--cyan); cursor: pointer;
        }
        .volume-val { font-size: 13px; font-weight: 600; color: var(--white);
            min-width: 36px; text-align: right; }

        .loop-row { display: flex; align-items: center; justify-content: space-between; }
        .loop-row span { font-size: 14px; color: var(--muted); }
        .toggle { position: relative; width: 44px; height: 24px; cursor: pointer; }
        .toggle input { opacity: 0; width: 0; height: 0; }
        .toggle-track {
            position: absolute; inset: 0; border-radius: 24px;
            background: rgba(255,255,255,0.12);
            transition: background 200ms;
        }
        .toggle input:checked + .toggle-track { background: var(--cyan); }
        .toggle-thumb {
            position: absolute; top: 3px; left: 3px;
            width: 18px; height: 18px; border-radius: 50%;
            background: white;
            transition: transform 200ms;
        }
        .toggle input:checked ~ .toggle-thumb { transform: translateX(20px); }

        .modal-actions { display: flex; gap: 10px; margin-top: 4px; }
        .btn-modal-save {
            flex: 1; background: var(--cyan); color: #000;
            border: none; padding: 14px; border-radius: 6px;
            font-family: 'Inter', sans-serif; font-size: 13px;
            font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
            cursor: pointer; transition: background 150ms, opacity 150ms;
        }
        .btn-modal-save:disabled { opacity: 0.4; cursor: default; }
        .btn-modal-save:not(:disabled):hover { background: #00bfe6; }
        .btn-modal-cancel {
            background: transparent; color: var(--muted);
            border: 1px solid var(--border); padding: 14px 20px;
            border-radius: 6px; font-size: 13px; font-weight: 600;
            cursor: pointer; transition: color 150ms;
        }
        .btn-modal-cancel:hover { color: var(--white); }
        .btn-modal-delete {
            background: transparent; color: var(--pink);
            border: 1px solid rgba(255,0,102,0.25); padding: 14px 16px;
            border-radius: 6px; font-size: 13px; font-weight: 700;
            cursor: pointer; transition: background 150ms;
        }
        .btn-modal-delete:hover { background: rgba(255,0,102,0.12); }

        .upload-progress {
            display: none; font-size: 12px; color: var(--cyan);
            text-align: center; padding: 4px 0;
        }
        .upload-progress.visible { display: block; }

        /* ===== TOAST ===== */
        .toast {
            position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
            background: var(--card); border: 1px solid var(--border);
            color: var(--white); padding: 12px 24px; border-radius: 8px;
            font-size: 13px; font-weight: 600;
            opacity: 0; pointer-events: none;
            transition: opacity 300ms ease;
            z-index: 300; white-space: nowrap;
        }
        .toast.show { opacity: 1; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 900px) {
            .sb-grid { grid-template-columns: repeat(4, 1fr); }
            .sb-title { font-size: 22px; }
        }
        @media (max-width: 600px) {
            .sb-grid { grid-template-columns: repeat(3, 1fr); gap: 10px; }
            .sb-grid-wrap { padding: 14px 14px 24px; }
            .sb-header { padding: 12px 16px; }
            .btn-stop-all span { display: none; }
        }
        @media (max-width: 400px) {
            .sb-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

<!-- PIN SCREEN -->
<div id="pin-screen">
    <img src="./dj-jakob-logo-new.PNG" alt="DJ Jakob" class="pin-logo">
    <h1 class="pin-title">Soundboard</h1>
    <p class="pin-sub">Voer je pincode in</p>
    <div class="pin-dots">
        <div class="pin-dot" id="dot-0"></div>
        <div class="pin-dot" id="dot-1"></div>
        <div class="pin-dot" id="dot-2"></div>
        <div class="pin-dot" id="dot-3"></div>
    </div>
    <div class="numpad">
        <button onclick="pinKey('1')">1</button>
        <button onclick="pinKey('2')">2</button>
        <button onclick="pinKey('3')">3</button>
        <button onclick="pinKey('4')">4</button>
        <button onclick="pinKey('5')">5</button>
        <button onclick="pinKey('6')">6</button>
        <button onclick="pinKey('7')">7</button>
        <button onclick="pinKey('8')">8</button>
        <button onclick="pinKey('9')">9</button>
        <button onclick="pinKey('0')">0</button>
        <button class="btn-backspace" onclick="pinBack()">⌫</button>
    </div>
</div>

<!-- APP -->
<div id="app">
    <header class="sb-header">
        <img src="./dj-jakob-logo-new.PNG" alt="DJ Jakob" class="sb-logo">
        <span class="sb-title">Soundboard</span>
        <button class="btn-stop-all" onclick="stopAll()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
            <span>Stop alles</span>
        </button>
        <button class="btn-logout" onclick="logout()">Uitloggen</button>
    </header>

    <div class="sb-grid-wrap">
        <div class="sb-grid" id="sb-grid">
            <!-- Buttons worden gegenereerd door JS -->
        </div>
    </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay">
    <div class="modal">
        <div class="modal-title" id="modal-title">Geluid toevoegen</div>

        <div class="modal-field">
            <label class="modal-label">Naam van het geluid</label>
            <input type="text" class="modal-input" id="modal-label-input" placeholder="bijv. Applaus, Sirene, Drumroll...">
        </div>

        <div class="modal-field">
            <label class="modal-label">Geluidsbestand (mp3, wav, ogg)</label>
            <div class="file-drop" id="file-drop">
                <div class="file-drop-icon">🎵</div>
                <div class="file-drop-text">Klik of sleep een audiobestand hiernaartoe</div>
                <div class="file-drop-name" id="file-drop-name"></div>
            </div>
            <input type="file" class="file-input-hidden" id="file-input" accept="audio/*">
        </div>

        <div class="modal-field">
            <label class="modal-label">Volume</label>
            <div class="volume-row">
                <input type="range" class="volume-slider" id="modal-volume" min="0" max="100" value="80">
                <span class="volume-val" id="modal-volume-val">80%</span>
            </div>
        </div>

        <div class="modal-field">
            <label class="modal-label">Herhalen (loop)</label>
            <div class="loop-row">
                <span>Geluid blijft herhalen totdat je stopt</span>
                <label class="toggle">
                    <input type="checkbox" id="modal-loop">
                    <div class="toggle-track"></div>
                    <div class="toggle-thumb"></div>
                </label>
            </div>
        </div>

        <div class="upload-progress" id="upload-progress">Bestand uploaden...</div>

        <div class="modal-actions">
            <button class="btn-modal-save" id="btn-modal-save" onclick="saveButton()">Opslaan</button>
            <button class="btn-modal-delete" id="btn-modal-delete" onclick="deleteButton()" style="display:none">Verwijderen</button>
            <button class="btn-modal-cancel" onclick="closeModal()">Annuleren</button>
        </div>
    </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://zweumhnigwyjfjuowzts.supabase.co';
const SUPABASE_KEY = 'sb_publishable_mf8ehnNab6mTM6qjoGIAxw_QrCc40nZ';
const BUCKET = 'soundboard';
const PIN = '1976';
const TOTAL = 24;

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

// Kleurenpalet voor knoppen (cycleert per slot)
const BTN_COLORS = ['#00D4FF','#FF0066','#FF8C00','#9B59FF','#1ED760','#0099FF'];
const BTN_RGB    = ['0,212,255','255,0,102','255,140,0','155,89,255','30,215,96','0,153,255'];

// ===== AUDIO STATE =====
// state[slot] = { audio, label, volume, loop, filePath, dbId }
const state = {};
let modalSlot = null;
let pendingFile = null;

// ===== PIN =====
let pinBuffer = '';

function pinKey(d) {
    if (pinBuffer.length >= 4) return;
    pinBuffer += d;
    document.getElementById(`dot-${pinBuffer.length - 1}`).classList.add('filled');
    if (pinBuffer.length === 4) {
        setTimeout(() => {
            if (pinBuffer === PIN) {
                sessionStorage.setItem('dj-auth', 'ok');
                document.getElementById('pin-screen').style.display = 'none';
                document.getElementById('app').style.display = 'flex';
                init();
            } else {
                pinBuffer = '';
                document.querySelectorAll('.pin-dot').forEach(d => d.classList.remove('filled'));
                showToast('Onjuiste pincode');
            }
        }, 120);
    }
}

function pinBack() {
    if (!pinBuffer.length) return;
    pinBuffer = pinBuffer.slice(0, -1);
    document.getElementById(`dot-${pinBuffer.length}`).classList.remove('filled');
}

function logout() {
    sessionStorage.removeItem('dj-auth');
    stopAll();
    document.getElementById('app').style.display = 'none';
    document.getElementById('pin-screen').style.display = 'flex';
    pinBuffer = '';
    document.querySelectorAll('.pin-dot').forEach(d => d.classList.remove('filled'));
}

// ===== INIT =====
async function init() {
    buildGrid();
    await loadButtons();
}

function buildGrid() {
    const grid = document.getElementById('sb-grid');
    grid.innerHTML = '';
    for (let s = 1; s <= TOTAL; s++) {
        const btn = document.createElement('div');
        btn.className = 'sb-btn empty';
        btn.dataset.slot = s;
        btn.innerHTML = `
            <div class="sb-playing-dot"></div>
            <div class="sb-plus">＋</div>
            <div class="sb-empty-label">Knop ${s}</div>`;
        btn.addEventListener('click', e => {
            if (e.target.closest('.sb-gear')) return;
            handleBtnClick(s);
        });
        grid.appendChild(btn);
    }
}

async function loadButtons() {
    const { data, error } = await db.from('soundboard_buttons').select('*').order('slot');
    if (error) { console.error('Laad fout:', error); return; }
    data.forEach(row => applyRow(row));
}

function applyRow(row) {
    const { publicUrl } = db.storage.from(BUCKET).getPublicUrl(row.file_path);
    const audio = new Audio(publicUrl);
    audio.volume = row.volume;
    audio.loop = row.loop;
    audio.addEventListener('ended', () => {
        if (!audio.loop) setPlaying(row.slot, false);
    });
    state[row.slot] = { audio, label: row.label, volume: row.volume,
                        loop: row.loop, filePath: row.file_path, dbId: row.id };
    renderFilledBtn(row.slot);
}

// ===== RENDER =====
function renderFilledBtn(slot) {
    const el = getBtn(slot);
    if (!el) return;
    const s = state[slot];
    const colorIdx = (slot - 1) % BTN_COLORS.length;
    const color = BTN_COLORS[colorIdx];
    const rgb = BTN_RGB[colorIdx];
    const volPct = Math.round(s.volume * 100);

    el.className = 'sb-btn filled';
    el.style.borderColor = color + '55';
    el.style.setProperty('--btn-rgb', rgb);
    el.innerHTML = `
        <div class="sb-playing-dot"></div>
        <button class="sb-gear" onclick="openModal(${slot})" aria-label="Instellingen">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
        </button>
        <div class="sb-btn-label">${escHtml(s.label)}</div>
        <div class="sb-volume-bar">
            <div class="sb-volume-fill" style="width:${volPct}%;background:${color}88"></div>
        </div>
        <div class="sb-meta">
            <span class="sb-slot-num">${slot}</span>
            ${s.loop ? '<span class="sb-loop-badge">∞ Loop</span>' : ''}
        </div>`;
}

function renderEmptyBtn(slot) {
    const el = getBtn(slot);
    if (!el) return;
    el.className = 'sb-btn empty';
    el.style.borderColor = '';
    el.style.removeProperty('--btn-rgb');
    el.innerHTML = `
        <div class="sb-playing-dot"></div>
        <div class="sb-plus">＋</div>
        <div class="sb-empty-label">Knop ${slot}</div>`;
}

function setPlaying(slot, playing) {
    const el = getBtn(slot);
    if (!el) return;
    el.classList.toggle('playing', playing);
}

function getBtn(slot) {
    return document.querySelector(`.sb-btn[data-slot="${slot}"]`);
}

function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ===== PLAY / STOP =====
function handleBtnClick(slot) {
    if (!state[slot]) { openModal(slot); return; }
    const s = state[slot];
    if (!s.audio.paused || s.audio.currentTime > 0) {
        s.audio.pause();
        s.audio.currentTime = 0;
        setPlaying(slot, false);
    } else {
        s.audio.play().catch(err => { console.error(err); showToast('Kan geluid niet afspelen'); });
        setPlaying(slot, true);
    }
}

function stopAll() {
    Object.entries(state).forEach(([slot, s]) => {
        if (s.audio) {
            s.audio.pause();
            s.audio.currentTime = 0;
            setPlaying(Number(slot), false);
        }
    });
}

// ===== MODAL =====
function openModal(slot) {
    modalSlot = slot;
    pendingFile = null;
    const existing = state[slot];

    document.getElementById('modal-title').textContent = existing ? 'Geluid bewerken' : 'Geluid toevoegen';
    document.getElementById('modal-label-input').value = existing ? existing.label : '';
    document.getElementById('modal-volume').value = existing ? Math.round(existing.volume * 100) : 80;
    document.getElementById('modal-volume-val').textContent = existing ? Math.round(existing.volume * 100) + '%' : '80%';
    document.getElementById('modal-loop').checked = existing ? existing.loop : false;
    document.getElementById('file-drop-name').textContent = existing ? '✓ Huidig bestand blijft bewaard' : '';
    document.getElementById('btn-modal-delete').style.display = existing ? 'block' : 'none';
    document.getElementById('upload-progress').classList.remove('visible');
    updateSaveBtn();

    document.getElementById('modal-overlay').classList.add('open');
}

function closeModal() {
    document.getElementById('modal-overlay').classList.remove('open');
    pendingFile = null;
    modalSlot = null;
}

function updateSaveBtn() {
    const hasFile = !!pendingFile || !!state[modalSlot];
    const hasLabel = document.getElementById('modal-label-input').value.trim().length > 0;
    document.getElementById('btn-modal-save').disabled = !(hasFile && hasLabel);
}

// File drop zone
const fileDrop = document.getElementById('file-drop');
const fileInput = document.getElementById('file-input');

fileDrop.addEventListener('click', () => fileInput.click());
fileDrop.addEventListener('dragover', e => { e.preventDefault(); fileDrop.classList.add('drag-over'); });
fileDrop.addEventListener('dragleave', () => fileDrop.classList.remove('drag-over'));
fileDrop.addEventListener('drop', e => {
    e.preventDefault(); fileDrop.classList.remove('drag-over');
    const f = e.dataTransfer.files[0];
    if (f && f.type.startsWith('audio/')) setFile(f);
    else showToast('Alleen audiobestanden (mp3, wav, ogg)');
});
fileInput.addEventListener('change', e => { if (e.target.files[0]) setFile(e.target.files[0]); });

function setFile(f) {
    pendingFile = f;
    document.getElementById('file-drop-name').textContent = '🎵 ' + f.name;
    if (!document.getElementById('modal-label-input').value.trim()) {
        const name = f.name.replace(/\.[^.]+$/, '').replace(/[-_]/g, ' ');
        document.getElementById('modal-label-input').value = name.charAt(0).toUpperCase() + name.slice(1);
    }
    updateSaveBtn();
}

document.getElementById('modal-label-input').addEventListener('input', updateSaveBtn);
document.getElementById('modal-volume').addEventListener('input', e => {
    document.getElementById('modal-volume-val').textContent = e.target.value + '%';
});

// ===== SAVE =====
async function saveButton() {
    const label = document.getElementById('modal-label-input').value.trim();
    const volume = parseInt(document.getElementById('modal-volume').value) / 100;
    const loop = document.getElementById('modal-loop').checked;
    const slot = modalSlot;
    const existing = state[slot];

    const saveBtn = document.getElementById('btn-modal-save');
    const progress = document.getElementById('upload-progress');
    saveBtn.disabled = true;
    progress.classList.add('visible');

    try {
        let filePath = existing ? existing.filePath : null;

        if (pendingFile) {
            // Stop oud audio object
            if (existing?.audio) { existing.audio.pause(); existing.audio.src = ''; }

            // Upload naar Supabase Storage
            const ext = pendingFile.name.split('.').pop();
            filePath = `slot-${slot}-${Date.now()}.${ext}`;

            const { error: upErr } = await db.storage.from(BUCKET).upload(filePath, pendingFile, { upsert: true });
            if (upErr) throw upErr;

            // Verwijder oud bestand als er een was
            if (existing?.filePath && existing.filePath !== filePath) {
                await db.storage.from(BUCKET).remove([existing.filePath]);
            }
        }

        // Upsert metadata
        const row = { slot, label, file_path: filePath, volume, loop };
        let dbId = existing?.dbId;

        if (dbId) {
            const { error } = await db.from('soundboard_buttons').update(row).eq('id', dbId);
            if (error) throw error;
        } else {
            const { data, error } = await db.from('soundboard_buttons').insert(row).select().single();
            if (error) throw error;
            dbId = data.id;
        }

        // Verwijder oud audio object uit state
        if (state[slot]?.audio) { state[slot].audio.pause(); state[slot].audio.src = ''; }
        delete state[slot];

        // Maak nieuw audio object
        const { publicUrl } = db.storage.from(BUCKET).getPublicUrl(filePath);
        const audio = new Audio(publicUrl);
        audio.volume = volume;
        audio.loop = loop;
        audio.addEventListener('ended', () => { if (!audio.loop) setPlaying(slot, false); });
        state[slot] = { audio, label, volume, loop, filePath, dbId };

        renderFilledBtn(slot);
        closeModal();
        showToast('Opgeslagen ✓');
    } catch (err) {
        console.error(err);
        showToast('Fout bij opslaan: ' + (err.message || err));
        saveBtn.disabled = false;
    } finally {
        progress.classList.remove('visible');
    }
}

// ===== DELETE =====
async function deleteButton() {
    const slot = modalSlot;
    const s = state[slot];
    if (!s) { closeModal(); return; }

    if (!confirm(`Knop ${slot} "${s.label}" verwijderen?`)) return;

    s.audio.pause(); s.audio.src = '';
    await db.from('soundboard_buttons').delete().eq('id', s.dbId);
    await db.storage.from(BUCKET).remove([s.filePath]);

    delete state[slot];
    setPlaying(slot, false);
    renderEmptyBtn(slot);
    closeModal();
    showToast('Verwijderd');
}

// ===== TOAST =====
function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2800);
}

// ===== STARTUP =====
document.getElementById('modal-overlay').addEventListener('click', e => {
    if (e.target === document.getElementById('modal-overlay')) closeModal();
});

if (sessionStorage.getItem('dj-auth') === 'ok') {
    document.getElementById('pin-screen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    init();
}
</script>
